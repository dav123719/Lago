<VirtualHost *:80>
    ServerName lago.lv
    ServerAlias www.lago.lv
    Redirect permanent / https://lago.lv/
    ErrorLog ${APACHE_LOG_DIR}/lago-error.log
    CustomLog ${APACHE_LOG_DIR}/lago-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www.lago.lv
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lago.lv/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lago.lv/privkey.pem
    Redirect permanent / https://lago.lv/
</VirtualHost>

<VirtualHost *:443>
    ServerName lago.lv
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lago.lv/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lago.lv/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass "/" "http://127.0.0.1:3100/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:3100/"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    <LocationMatch "^/((api|admin|studio|auth)(/|$)|(lv|en|ru)/account(/|$))">
        Header always set Cache-Control "private, no-store"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/lago-error.log
    CustomLog ${APACHE_LOG_DIR}/lago-access.log combined
</VirtualHost>
