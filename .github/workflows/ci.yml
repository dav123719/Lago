name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  account-database-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install isolated PostgreSQL test engine outside the application
        run: npm install --prefix "$RUNNER_TEMP/lago-sql-tests" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.11
      - name: Verify bootstrap and real-role profile permissions with synthetic data
        run: node scripts/verify-owner-bootstrap.mjs "$RUNNER_TEMP/lago-sql-tests/node_modules/@electric-sql/pglite/dist/index.js"
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_SANITY_PROJECT_ID: abc12345
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:budgets
      - run: npm run type-check
