name: Optional Lighthouse report
# Synthetic public configuration; run manually, never with production secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_SANITY_PROJECT_ID: abc12345
      NEXT_PUBLIC_SANITY_DATASET: production
      HOSTNAME: 127.0.0.1
      PORT: '3100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare standalone assets and browser
        run: |
          mkdir -p dist/standalone/dist
          cp -a dist/static dist/standalone/dist/static
          cp -a public dist/standalone/public
          npx --no-install playwright install --with-deps chromium
          chrome_path=$(node -p "require('@playwright/test').chromium.executablePath()")
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Collect standalone Lighthouse report
        run: |
          cat > "$RUNNER_TEMP/lago-lhci.cjs" <<'CONFIG'
          module.exports = {
            ci: {
              collect: {
                startServerCommand: 'node dist/standalone/server.js',
                startServerReadyPattern: 'Ready',
                startServerReadyTimeout: 60000,
                url: ['http://127.0.0.1:3100/lv/', 'http://127.0.0.1:3100/en/'],
                numberOfRuns: 1,
                settings: { chromeFlags: '--headless --no-sandbox' },
              },
              upload: { target: 'filesystem', outputDir: 'lighthouse-reports' },
            },
          }
          CONFIG
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun --config="$RUNNER_TEMP/lago-lhci.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            lighthouse-reports/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: warn
